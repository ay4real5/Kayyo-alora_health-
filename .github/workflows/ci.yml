# Runs on GitHub's machines for every push and PR, so nothing heavy has to run on a developer laptop.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alora_test
          POSTGRES_USER: alora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alora -d alora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://alora:ci-only-password@localhost:5432/alora_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000
      # Throwaway key for CI test data only — never used anywhere real.
      PHI_ENCRYPTION_KEY: hBu2w8X/qvhzK7L7aRK0fdYGPUDLkz4+wrrfmhaBBEA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check committed OpenAPI files are up to date (run `npm run openapi -w @alora/api` if this fails)
        run: |
          npm run openapi -w @alora/api
          git diff --exit-code -- docs/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Apply migrations
        run: npm run db:deploy -w @alora/api
      - name: Check migrations match schema.prisma (fails if someone forgot a migration)
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run test:e2e -w @alora/api

  docker:
    name: Docker images (API, dashboard, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f docker/Dockerfile.api -t alora-api:ci .
          docker build -f docker/Dockerfile.migrate -t alora-migrate:ci .
          docker build -f docker/Dockerfile.web --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1 -t alora-web:ci .
      - name: Start stack and check health
        env:
          JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000
          DATABASE_URL: postgresql://alora:localdev123@localhost:5432/alora_health
        run: |
          docker compose up -d --no-build --wait postgres redis
          # The API refuses to start on an unmigrated database: the migration image runs first, as in production.
          docker run --rm --network host -e DATABASE_URL alora-migrate:ci
          docker run -d --name api --network host -e DATABASE_URL -e JWT_SECRET alora-api:ci
          docker run -d --name web --network host alora-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/v1/health && curl -fsS -o /dev/null http://localhost:3000/login; then
              echo; echo "API and dashboard are up"
              # The dashboard sends its per-request CSP (D-068) from the container too.
              curl -fsSI http://localhost:3000/login | grep -i "content-security-policy: .*nonce-"
              exit 0
            fi
            sleep 2
          done
          echo "Containers did not become healthy"
          docker logs api; docker logs web
          # Also surface the log tails as annotations, which are readable without signing in to GitHub.
          echo "::error title=API container log::$(docker logs api 2>&1 | tail -15 | tr '\n' '|')"
          echo "::error title=Web container log::$(docker logs web 2>&1 | tail -15 | tr '\n' '|')"
          exit 1
      - name: nginx config is valid
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" -keyout certs/privkey.pem -out certs/fullchain.pem
          docker run --rm --add-host api:127.0.0.1 --add-host web:127.0.0.1 -e DOMAIN=localhost -e NGINX_ENVSUBST_FILTER=DOMAIN \
            -v "$PWD/docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/certs:/etc/nginx/certs:ro" nginx:1.29-alpine nginx -t

  browser:
    name: Browser tests (dashboard + API + database)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alora_e2e
          POSTGRES_USER: alora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alora -d alora_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://alora:ci-only-password@localhost:5432/alora_e2e
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000
      PHI_ENCRYPTION_KEY: hBu2w8X/qvhzK7L7aRK0fdYGPUDLkz4+wrrfmhaBBEA=
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      # The suite signs in dozens of times a minute from one IP — more than the sign-in limit allows.
      RATE_LIMITS_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply migrations
        run: npm run db:deploy -w @alora/api
      - name: Start the API and the dashboard
        run: |
          (cd apps/api && nohup node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && nohup npx next start --port 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/v1/health >/dev/null && curl -fsS http://localhost:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error title=Servers did not start::$(tail -20 api.log web.log | tr '\n' '|')"
          exit 1
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run browser tests (the demo agency is seeded first)
        run: npx playwright test --reporter=github,list
        working-directory: apps/web
      - name: Server logs on failure
        if: failure()
        run: |
          echo "::error title=API log::$(tail -30 api.log | tr '\n' '|')"
          echo "::error title=Web log::$(tail -30 web.log | tr '\n' '|')"
