# Runs on GitHub's machines for every push and PR, so nothing heavy has to run on a developer laptop.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alora_test
          POSTGRES_USER: alora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alora -d alora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://alora:ci-only-password@localhost:5432/alora_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000
      # Throwaway key for CI test data only — never used anywhere real.
      PHI_ENCRYPTION_KEY: hBu2w8X/qvhzK7L7aRK0fdYGPUDLkz4+wrrfmhaBBEA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check committed OpenAPI files are up to date (run `npm run openapi -w @alora/api` if this fails)
        run: |
          npm run openapi -w @alora/api
          git diff --exit-code -- docs/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Apply migrations
        run: npm run db:deploy -w @alora/api
      - name: Check migrations match schema.prisma (fails if someone forgot a migration)
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run test:e2e -w @alora/api

  docker:
    name: Docker image (API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.api -t alora-api:ci .
      - name: Start stack and check health
        env:
          JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000
        run: |
          docker compose up -d --no-build --wait postgres redis
          # The API refuses to start on an unmigrated database, so apply the migrations first.
          for f in apps/api/prisma/migrations/*/migration.sql; do
            docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -q -U alora -d alora_health < "$f"
          done
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://alora:localdev123@localhost:5432/alora_health \
            -e JWT_SECRET \
            alora-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/v1/health; then echo; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"
          docker logs api
          # Also surface the log tail as an annotation, which is readable without signing in to GitHub.
          echo "::error title=API container log::$(docker logs api 2>&1 | tail -15 | tr '\n' '|')"
          exit 1

  browser:
    name: Browser tests (dashboard + API + database)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alora_e2e
          POSTGRES_USER: alora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alora -d alora_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://alora:ci-only-password@localhost:5432/alora_e2e
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000
      PHI_ENCRYPTION_KEY: hBu2w8X/qvhzK7L7aRK0fdYGPUDLkz4+wrrfmhaBBEA=
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply migrations
        run: npm run db:deploy -w @alora/api
      - name: Start the API and the dashboard
        run: |
          (cd apps/api && nohup node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && nohup npx next start --port 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/v1/health >/dev/null && curl -fsS http://localhost:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error title=Servers did not start::$(tail -20 api.log web.log | tr '\n' '|')"
          exit 1
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run browser tests (the demo agency is seeded first)
        run: npx playwright test --reporter=github,list
        working-directory: apps/web
      - name: Server logs on failure
        if: failure()
        run: |
          echo "::error title=API log::$(tail -30 api.log | tr '\n' '|')"
          echo "::error title=Web log::$(tail -30 web.log | tr '\n' '|')"
