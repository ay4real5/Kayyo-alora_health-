# Runs on GitHub's machines for every push and PR, so nothing heavy has to run on a developer laptop.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alora_test
          POSTGRES_USER: alora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alora -d alora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://alora:ci-only-password@localhost:5432/alora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Apply migrations
        run: npm run db:deploy -w @alora/api
      - name: Check migrations match schema.prisma (fails if someone forgot a migration)
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run test:e2e -w @alora/api

  docker:
    name: Docker image (API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.api -t alora-api:ci .
      - name: Start stack and check health
        run: |
          docker compose up -d --no-build postgres redis
          docker run -d --name api -p 3001:3001 alora-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/v1/health; then echo; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; docker logs api; exit 1
